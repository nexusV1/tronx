workflows:
  # APK de prueba: se instala directo en el teléfono, sin firma propia.
  tronx-apk-debug:
    name: Tronx APK (prueba)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Copiar fuentes
        script: npm run build:web
      - name: Crear proyecto Android
        script: npx cap add android
      - name: Ajustar versión
        script: node scripts/patch-android.mjs
      - name: Generar íconos y pantalla de inicio
        script: npx capacitor-assets generate --android
      - name: Sincronizar la web con Android
        script: npx cap sync android
      - name: Compilar APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  # APK firmado para publicar o instalar de forma permanente.
  # Antes de usarlo: en Codemagic, Teams > Code signing identities > Android keystores,
  # subí tu keystore con la referencia "tronx_keystore".
  tronx-apk-release:
    name: Tronx APK (firmado)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
      android_signing:
        - tronx_keystore
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Copiar fuentes
        script: npm run build:web
      - name: Crear proyecto Android
        script: npx cap add android
      - name: Ajustar versión y firma
        script: node scripts/patch-android.mjs
      - name: Generar íconos y pantalla de inicio
        script: npx capacitor-assets generate --android
      - name: Sincronizar la web con Android
        script: npx cap sync android
      - name: Compilar APK firmado
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
