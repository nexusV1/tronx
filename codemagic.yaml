workflows:
  # APK de prueba: se instala directo en el teléfono, pero queda firmado con una clave de depuración que
  # Codemagic crea de nuevo en cada build. Por eso NO se puede instalar encima de una versión anterior:
  # para actualizar sin desinstalar, usá el workflow "Tronx APK (firmado)" de abajo.
  tronx-apk-debug:
    name: Tronx APK (prueba)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Copiar fuentes
        script: npm run build:web
      - name: Crear proyecto Android
        script: npx cap add android
      - name: Ajustar versión
        script: node scripts/patch-android.mjs
      - name: Generar íconos y pantalla de inicio
        script: npx capacitor-assets generate --android
      - name: Sincronizar la web con Android
        script: npx cap sync android
      - name: Compilar APK
        script: |
          cd android
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/**/*.apk

  # APK firmado con TU clave fija: cada versión nueva se instala encima de la anterior y conserva las notas.
  # Antes de usarlo: en Codemagic, Teams > Code signing identities > Android keystores, creá o subí un keystore
  # con la referencia "tronx_keystore". Guardá una copia de ese archivo y de su contraseña: si la perdés,
  # no podrás actualizar la app (habría que desinstalarla). Nunca los subas a GitHub.
  tronx-apk-release:
    name: Tronx APK (firmado)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
      android_signing:
        - tronx_keystore
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Copiar fuentes
        script: npm run build:web
      - name: Crear proyecto Android
        script: npx cap add android
      - name: Ajustar versión y firma
        script: node scripts/patch-android.mjs
      - name: Generar íconos y pantalla de inicio
        script: npx capacitor-assets generate --android
      - name: Sincronizar la web con Android
        script: npx cap sync android
      - name: Compilar APK firmado
        script: |
          cd android
          ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk
